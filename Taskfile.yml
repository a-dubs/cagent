version: "3"

vars:
  BINARY_NAME: cagent{{if eq OS "windows"}}.exe{{end}}
  MAIN_PKG: ./main.go
  BUILD_DIR: ./bin
  AGENTS_PATH: ./examples/config
  GIT_TAG:
    sh: git describe --tags --exact-match 2>/dev/null || echo dev
  GIT_COMMIT:
    sh: git rev-parse HEAD
  BUILD_DATE:
    sh: date -u +"%Y-%m-%dT%H:%M:%SZ"
  GO_SOURCES: "**/*.go"
  BUILD_ARGS: '--build-arg GIT_TAG="{{.GIT_TAG}}" --build-arg GIT_COMMIT="{{.GIT_COMMIT}}" --build-arg BUILD_DATE="{{.BUILD_DATE}}"'
  LDFLAGS: '-X "github.com/docker/cagent/cmd/root.Version={{.GIT_TAG}}" -X "github.com/docker/cagent/cmd/root.Commit={{.GIT_COMMIT}}" -X "github.com/docker/cagent/cmd/root.BuildTime={{.BUILD_DATE}}"'

tasks:
  default:
    cmd: task --list

  build-web:
    desc: Build the web frontend
    dir: web
    cmds:
      - npm run build
    sources:
      - "src/**/*"
      - "package.json"
      - "vite.config.ts"
    generates:
      - "dist/**/*"

  web:install:
    desc: Install web dependencies (npm install)
    dir: web
    cmds:
      - npm install
    sources:
      - "package.json"
      - "package-lock.json"
    generates:
      - "node_modules"

  web:dev:prepare:
    desc: Ensure web/dist exists for go:embed during dev
    cmds:
      - mkdir -p web/dist
      - |
        if [ ! -f web/dist/.placeholder ]; then echo dev > web/dist/.placeholder; fi

  web:dev:backend:
    desc: Run Go API server on :8080 with agents from {{.AGENTS_PATH}}
    deps:
      - web:dev:prepare
    cmds:
      - go run . web {{.AGENTS_PATH}} -d -l :8080

  web:dev:frontend:
    desc: Run Vite dev server with proxy to :8080
    deps:
      - web:install
    dir: web
    cmds:
      - npm run dev

  web:dev:
    desc: Run frontend and backend dev servers together (Vite on :5173, API on :8080)
    deps:
      - web:dev:backend
      - web:dev:frontend

  build:
    desc: Build the application binary
    deps:
      - build-web
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.MAIN_PKG}}
    sources:
      - "{{.GO_SOURCES}}"
      - "**/*.txt"
      - "go.mod"
      - "go.sum"
      - "web/dist/**/*"
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}}"

  link:
    desc: Creates a symlink to ~/bin
    cmd: ln -sf {{.USER_WORKING_DIR}}/{{.BUILD_DIR}}/{{.BINARY_NAME}} {{.HOME}}/bin/{{.BINARY_NAME}}

  lint:
    desc: Run golangci-lint
    cmd: golangci-lint run ./...
    sources:
      - "{{.GO_SOURCES}}"
      - ".golangci.yml"

  test:
    desc: Run tests
    deps:
      - build-web
    cmd: go test ./...
    sources:
      - "{{.GO_SOURCES}}"
      - "**/*.txt"
      - "web/dist/**/*"

  build-image:
    desc: Build Docker image
    cmd: docker buildx build -t docker/cagent:latest {{.BUILD_ARGS}} .

  build-local:
    desc: Build binaries for local host platform
    cmd: docker buildx build --target=local {{.BUILD_ARGS}} --platform local --output=./dist .

  cross:
    desc: Build binaries for multiple platforms
    cmd: docker buildx build --target=cross {{.BUILD_ARGS}} --platform linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64 --output=./dist .
