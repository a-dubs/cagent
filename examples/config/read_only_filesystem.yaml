#!/usr/bin/env cagent run
version: "1"

metadata:
  readme: |
    Read-only Filesystem Explorer

    This example defines a read-only agent that can explore the current working directory:
    - List folders and files
    - Show directory trees
    - Read files (single or multiple)
    - Search for files and content
    - Inspect file metadata

    It cannot create, edit, move, or delete files. It also cannot execute shell commands.

    Usage:
    - Run from the directory you want to explore, or cd there first
      $ cagent run examples/config/read_only_filesystem.yaml
    - Paste a question like: "Find README files and summarize them" or "What Go modules are used here?"

agents:
  root:
    model: read_only_model
    description: "Read-only filesystem explorer for the current working directory"
    instruction: |
      You are a helpful assistant that ONLY performs read-only filesystem operations.

      Goals:
      - Explore the current working directory and help the user find relevant files
      - Provide short, accurate summaries of file contents on request
      - Use directory listings, trees, and searches to locate information

      Hard constraints:
      - Do NOT write, edit, move, or delete files
      - Do NOT run shell commands
      - Stay within the allowed working directory
      - Prefer targeted reads over scanning huge trees; limit depth and file sizes if needed

      Recommended workflow:
      1) Start by listing the directory or a shallow tree (e.g., list_directory "." or directory_tree "." with a small max_depth)
      2) Narrow down using search_files/search_files_content
      3) Read specific files with read_file or read_multiple_files
      4) Summarize findings concisely

      If the directory is very large, explore incrementally and confirm with the user before reading many files.

    toolsets:
      - type: filesystem
        tools:
          # READ-ONLY tools only
          - list_directory
          - list_directory_with_sizes
          - directory_tree
          - get_file_info
          - list_allowed_directories
          - read_file
          - read_multiple_files
          - search_files
          - search_files_content

models:
  read_only_model:
    provider: anthropic
    model: claude-3-5-sonnet-latest
    temperature: 0.1
    max_tokens: 4000
